[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "C4", "SIM", "PERF", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
# Makes `pytest` behave like `python -m pytest`, which implicitly puts the
# project root on sys.path. Without this, bare `pytest` cannot import src/ or
# data/ -- and the two invocations disagreeing is exactly how a suite passes
# locally and fails in CI.
pythonpath = ["."]
