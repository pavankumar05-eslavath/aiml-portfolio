# Alembic configuration.
#
# The database URL is NOT stored here. It is read from the application settings
# (and therefore from DATABASE_URL) inside alembic/env.py, so migrations always
# target the same database the application uses and no credential is committed.

[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = os

# Migration filenames are prefixed with a UTC timestamp so they sort
# chronologically in a directory listing and in code review.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d-%%(rev)s_%%(slug)s
timezone = UTC

[post_write_hooks]
# Newly generated migrations are formatted like the rest of the codebase.
# `exec` rather than `console_scripts`: ruff is distributed as a standalone
# binary and exposes no console_scripts entry point, so the console_scripts hook
# type fails with "Could not find entrypoint console_scripts.ruff".
hooks = ruff_format
ruff_format.type = exec
ruff_format.executable = ruff
ruff_format.options = format REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
