# Response headers applied to every location.
#
# This lives in its own file because of an nginx inheritance rule that is easy to
# get wrong: `add_header` directives are NOT merged across levels. If a `location`
# block declares even one `add_header`, every `add_header` from the enclosing
# `server` block is discarded for that location. Declaring these once at server
# level therefore silently drops them from any location that sets a cache header -
# which is exactly what happened here before this file existed.
#
# Including this file in each location keeps the headers present everywhere.
#
# It is installed under /etc/nginx/snippets/ rather than /etc/nginx/conf.d/,
# because the base image's nginx.conf does `include /etc/nginx/conf.d/*.conf`
# inside the http block; a snippet placed there would also be applied globally and
# every header would be emitted twice.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
