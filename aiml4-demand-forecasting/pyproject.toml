[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "C4", "SIM", "PERF", "RUF"]
# E501: long lines are prose in docstrings and report text.
# RUF001: en dashes and × are deliberate typography in generated markdown.
ignore = ["E501", "RUF001"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402", "SLF001"]
# matplotlib.use("Agg") must run before pyplot is imported, which E402 forbids.
"src/eda.py" = ["E402"]
"src/evaluation/plots.py" = ["E402"]
"app/streamlit_app.py" = ["E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
# Makes bare `pytest` behave like `python -m pytest`, which implicitly puts the
# project root on sys.path. The two invocations disagreeing is how a suite passes
# locally and fails in CI.
pythonpath = ["."]
