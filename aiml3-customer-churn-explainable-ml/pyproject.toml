[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "C4", "SIM", "PERF", "RUF"]
# E501: long lines are allowed; several are prose in docstrings and report text.
# RUF001: en dashes are used deliberately in the generated markdown reports and
#         notebook prose, where they are correct typography rather than a typo.
ignore = ["E501", "RUF001"]

[tool.ruff.lint.per-file-ignores]
# Tests import private helpers deliberately, and notebooks-as-code need E402.
"tests/*" = ["E402", "SLF001"]
# matplotlib.use("Agg") must run before pyplot is imported, which E402 forbids.
"src/eda.py" = ["E402"]
"src/explainability/shap_analysis.py" = ["E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
# Makes `pytest` behave like `python -m pytest`, which implicitly puts the
# project root on sys.path. Without this, bare `pytest` cannot import src/ --
# and the two invocations disagreeing is exactly how a suite passes locally and
# fails in CI.
pythonpath = ["."]
